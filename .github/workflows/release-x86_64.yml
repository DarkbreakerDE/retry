name: Release x86_64 Linux

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: x86_64-release
  cancel-in-progress: false

jobs:
  ci:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/rust-ci.yml

  version:
    needs: ci
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/rust-release-version.yml

  release:
    needs: version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package release binary
        run: |
          mkdir -p dist
          tar -czf "dist/retry-${{ needs.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release retry

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            "dist/retry-${{ needs.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "retry ${{ needs.version.outputs.version }}" \
            --generate-notes
